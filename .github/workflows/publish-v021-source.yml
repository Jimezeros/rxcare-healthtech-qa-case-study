name: Publish RxCare v0.2.1 source baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the public main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the reviewed public base
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "eb2a6cf93a6498baa2be95c092e0404c9105f0b7"

      - name: Install the reviewed v0.2.1 source and tests
        shell: bash
        run: |
          cat <<'RXCARE_SOURCE_B64' | base64 --decode > /tmp/rxcare-source-v0.2.1.tgz
          
          RXCARE_SOURCE_B64
          tar -xzf /tmp/rxcare-source-v0.2.1.tgz
          git add VERSION pyproject.toml scripts sql src tests
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Establish RxCare v0.2.1 source baseline"
          git push origin HEAD:main

      - name: Record the resulting source commit
        shell: bash
        run: |
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$(cat VERSION)" >> "$GITHUB_STEP_SUMMARY"
