name: Publish RxCare v0.2.1 final release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source lineage
        shell: bash
        run: |
          set -euo pipefail
          S_PUB=1c18d9c8e11207143ed03e85f94ec982369f3877
          git merge-base --is-ancestor "$S_PUB" HEAD
          test "$(git show "$S_PUB:VERSION")" = "0.2.1"

      - name: Decode reviewed release archive
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode > /tmp/RxCare_v0.2.1_release_archive.zip <<'RXCARE_ARCHIVE'
          
          RXCARE_ARCHIVE
          echo "61d68c572ecb90f6013b3dfc4540134b3f1aebe6106889263008621de5908a27  /tmp/RxCare_v0.2.1_release_archive.zip" | sha256sum --check
          mkdir -p /tmp/rxcare-v021
          unzip -q /tmp/RxCare_v0.2.1_release_archive.zip -d /tmp/rxcare-v021
          test "$(cat /tmp/rxcare-v021/VERSION)" = "0.2.1"

      - name: Replace repository tree with reviewed release
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/rxcare-v021/. .
          test ! -e .github
          test ! -e HealthTech_QA_Jira_Master_Prompt.md

      - name: Verify tests, evidence, links and privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m unittest discover -s tests -v
          (cd evidence/execution/20260818T101617Z-v0.2.1 && sha256sum --check sha256_manifest.txt)
          (cd evidence/execution/20260818T101641Z-ui-loopback-v0.2.1 && sha256sum --check sha256_manifest.txt)
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          missing = []
          for md in root.rglob('*.md'):
              text = md.read_text(encoding='utf-8')
              for target in re.findall(r'!?(?:\[[^\]]*\])\(([^)]+)\)', text):
                  target = target.strip().split('#', 1)[0]
                  if not target or '://' in target or target.startswith('mailto:'):
                      continue
                  if not (md.parent / target).resolve().exists():
                      missing.append(f'{md} -> {target}')
          if missing:
              raise SystemExit('Broken relative links:\n' + '\n'.join(missing))
          forbidden = [
              '20260818T081713Z-v0.2.1',
              '20260818T081845Z-ui-loopback-v0.2.1',
              '641f1f1d222bb768a3fe443a17b742611047aa5a',
              '/Users/dimitriosmezes',
              'dmezes@gmail.com',
          ]
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() in {'.jpg', '.png', '.zip'}:
                  continue
              try:
                  content = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for needle in forbidden:
                  if needle in content:
                      raise SystemExit(f'Forbidden publication text in {path}: {needle}')
          print('Documentation links and publication boundary: OK')
          PY

      - name: Commit release tree
        id: release_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Dimitrios Mezes"
          git config user.email "Jimezeros@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Release RxCare v0.2.1"
          R_SHA=$(git rev-parse HEAD)
          echo "r_sha=$R_SHA" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Create annotated tag
        shell: bash
        run: |
          set -euo pipefail
          R_SHA="${{ steps.release_commit.outputs.r_sha }}"
          git tag -a v0.2.1 "$R_SHA" -m "RxCare v0.2.1

          Release commit: $R_SHA
          Source/test commit: 1c18d9c8e11207143ed03e85f94ec982369f3877
          Source fingerprint: 707cd8949c0e1ac48e535b3749339d6178864978115f21e58f23fd976ad80521
          API evidence: 20260818T101617Z-v0.2.1
          UI attempt: 20260818T101641Z-ui-loopback-v0.2.1 (BLOCKED - NOT EXECUTED)"
          git push origin v0.2.1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          R_SHA="${{ steps.release_commit.outputs.r_sha }}"
          cat > /tmp/RxCare_v0.2.1_SHA256.txt <<'CHECKSUM'
          61d68c572ecb90f6013b3dfc4540134b3f1aebe6106889263008621de5908a27  RxCare_v0.2.1_release_archive.zip
          CHECKSUM
          cat > /tmp/release-notes.md <<EOF
          ## RxCare v0.2.1

          Evidence-backed patch release of the local, synthetic-data HealthTech QA vertical slice.

          ### Provenance binding

          - **Release commit (R):** `$R_SHA`
          - **Public source/test commit (S):** `1c18d9c8e11207143ed03e85f94ec982369f3877`
          - **27-file source fingerprint (H):** `707cd8949c0e1ac48e535b3749339d6178864978115f21e58f23fd976ad80521`
          - **Canonical API/automated run:** `20260818T101617Z-v0.2.1` — 5/5 API cases and 32/32 automated tests passed
          - **Specified concurrency regression:** 1 accepted, 39 controlled duplicate conflicts, 1 canonical row, 40 privacy-minimised audit events
          - **Canonical loopback/UI attempt:** `20260818T101641Z-ui-loopback-v0.2.1` — **BLOCKED — NOT EXECUTED** because the restricted environment denied the loopback bind

          ### Scope boundary

          This release demonstrates a local educational prototype using synthetic data. It does **not** claim production readiness, universal concurrency or load safety, genuine browser/JavaScript execution, clinical validation, GDPR/MDR compliance, cybersecurity certification, authentication/RBAC, deployment, or completed Phase 3 domain review.

          ### Authorship

          Project owner and human creator: **Dimitrios Mezes**. AI-assisted engineering tools supported drafting, implementation and review under his direction; published claims are tied to tests and immutable evidence rather than tool output alone.

          The attached ZIP is the privacy-reviewed, `.git`-free release tree. Its SHA-256 is provided as a separate asset and can be used for optional external timestamping.
          EOF
          gh release create v0.2.1             --verify-tag             --title "RxCare v0.2.1 — Verified concurrency patch"             --notes-file /tmp/release-notes.md             /tmp/RxCare_v0.2.1_release_archive.zip             /tmp/RxCare_v0.2.1_SHA256.txt
